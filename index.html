<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مصحفِ حفظ — سورۃ البروج | مائیک چیک</title>
<style>
  body{font-family:system-ui,-apple-system,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;background:#f5f7f5;margin:0;color:#172018}
  .wrap{max-width:850px;margin:auto;padding:16px}
  h1{text-align:center;margin:8px 0 4px}
  .sub{text-align:center;color:#59645b;margin-bottom:14px}
  .card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
  .ayah{font-size:32px;line-height:2.4;text-align:right}
  button{border:0;border-radius:12px;padding:13px 17px;font-size:17px;margin:4px;cursor:pointer}
  #start{background:#176b3a;color:#fff}
  #stop{background:#a52b2b;color:#fff}
  #status{font-weight:700;text-align:center;margin:10px 0;font-size:15px}
  .word{padding:2px 4px;border-radius:6px;transition:background 0.2s}
  .word.ok{color:#176b3a}
  .word.bad{color:#b32121;background:#ffe0e0;text-decoration:underline;font-weight:800}
  .word.current{background:#fff3b0}
  .small{font-size:13px;color:#6b746c;line-height:1.7}
  .controls{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>سورۃ البروج — حفظ سنانے والا</h1>
  <div class="sub">مائیک دبائیں اور پڑھنا شروع کریں؛ ایپ صرف غلطی پر نشاندہی کرے گی۔</div>

  <div class="card controls">
    <button id="start">🎙️ سننا شروع کریں</button>
    <button id="micTest" style="background:#315a8a;color:#fff">🎤 مائیک چیک کریں</button>
    <button id="stop">⏹️ بند کریں</button>
    <div id="status">تیار ہے</div>
  </div>

  <div class="card">
    <div id="ayah" class="ayah"></div>
  </div>

  <div class="card small">
    <b>نوٹ:</b> جب آپ صحیح پڑھیں گے تو الفاظ سبز ہوں گے، اور جب غلط پڑھیں گے تو وہ لفظ لال ہو جائے گا۔
  </div>
</div>

<script>
const fullSurah = "وَالسَّمَاءِ ذَاتِ الْبُرُوجِ وَالْيَوْمِ الْمَوْعُودِ وَشَاهِدٍ وَمَشْهُودٍ قُتِلَ أَصْحَابُ الْأُخْدُودِ النَّارِ ذَاتِ الْوَقُودِ إِذْ هُمْ عَلَيْهَا قُعُودٌ وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَنْ يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ وَهُوَ الْغَفُورُ الْوَدُودُ ذُو الْعَرْشِ الْمَجِيدُ فَعَّالٌ لِمَا يُرِيدُ هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ فِرْعَوْنَ وَثَمُودَ بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ وَاللَّهُ مِنْ وَرَائِهِمْ مُحِيطٌ بَلْ هُوَ قُرْآنٌ مَجِيدٌ فِي لَوْحٍ مَحْفُوظٍ";

let targetWords = [];
let targetNormalized = [];
let recognition=null, listening=false;
let finalText="", interimText="";

const ayahEl=document.getElementById("ayah");
const statusEl=document.getElementById("status");

function normalize(s){
  return s.normalize("NFD")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
    .replace(/[إأٱآ]/g,"ا").replace(/ى/g,"ی").replace(/ي/g,"ی")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ی")
    .replace(/[ـۖۗۚۛۜۙۘۚۛ۞]/g,"")
    .replace(/[،؛,.!?؟]/g," ")
    .replace(/[^\u0600-\u06FF\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function words(s){return normalize(s).split(" ").filter(Boolean)}

function removeRepeatedWords(arr){
  const cleaned = [];
  for(let k=0; k<arr.length; k++){
    if(k === 0 || arr[k] !== arr[k-1]){
      cleaned.push(arr[k]);
    }
  }
  return cleaned;
}

// ✅ نرم موازنہ: دو الفاظ میں کتنے فیصد مماثلت ہے
function similarity(a, b){
  if(a === b) return 1.0;
  if(!a || !b) return 0.0;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if(longer.length === 0) return 1.0;
  // Levenshtein distance
  const matrix = [];
  for(let i=0; i<=shorter.length; i++) matrix[i] = [i];
  for(let j=0; j<=longer.length; j++) matrix[0][j] = j;
  for(let i=1; i<=shorter.length; i++){
    for(let j=1; j<=longer.length; j++){
      const cost = shorter[i-1] === longer[j-1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i-1][j] + 1,
        matrix[i][j-1] + 1,
        matrix[i-1][j-1] + cost
      );
    }
  }
  const distance = matrix[shorter.length][longer.length];
  return (longer.length - distance) / longer.length;
}

// ✅ ہر لفظ کا نرم موازنہ (کم از کم 70% مماثلت)
function fuzzyMatch(target, got){
  const sim = similarity(target, got);
  return sim >= 0.7; // 70% یا اس سے زیادہ مماثلت
}

function renderSurah(){
  const ws = fullSurah.split(" ");
  ayahEl.innerHTML = ws.map((w, idx)=>{
    return `<span class="word" data-idx="${idx}">${w}</span>`;
  }).join(" ");
  targetWords = ws;
  targetNormalized = words(fullSurah);
}

function highlightWords(spoken){
  const got = removeRepeatedWords(words(spoken));
  const spans = ayahEl.querySelectorAll(".word");
  
  spans.forEach(s => s.classList.remove("ok","bad","current"));
  
  let errors = 0;
  let lastMatchedIndex = -1;
  
  for(let k=0; k<got.length; k++){
    if(k < targetNormalized.length){
      const span = spans[k];
      // ✅ نرم موازنہ استعمال کریں
      if(fuzzyMatch(targetNormalized[k], got[k])){
        span.classList.add("ok");
        lastMatchedIndex = k;
      } else {
        span.classList.add("bad");
        errors++;
      }
    }
  }
  
  if(lastMatchedIndex + 1 < spans.length && errors === 0){
    spans[lastMatchedIndex + 1].classList.add("current");
  }
  
  if(errors > 0){
    statusEl.textContent = `⚠️ ${errors} لفظ(وں) میں غلطی — دوبارہ پڑھیں`;
    statusEl.style.color = "#b32121";
    if("speechSynthesis" in window){
      const u = new SpeechSynthesisUtterance("غلطی");
      u.lang = "ur-PK"; speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  } else {
    statusEl.textContent = "🎙️ سن رہا ہوں…";
    statusEl.style.color = "#176b3a";
  }
  
  if(got.length >= targetNormalized.length && errors === 0){
    statusEl.textContent = "✅ ماشاءاللہ! سورت مکمل";
    statusEl.style.color = "#176b3a";
    listening = false;
    if(recognition) recognition.stop();
  }
}

function makeRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){statusEl.textContent="اس براؤزر میں آواز پہچاننے کی سہولت نہیں۔ Chrome استعمال کریں۔";return null;}
  const r=new SR();
  r.lang="ar-SA"; r.continuous=true; r.interimResults=true;
  
  r.onstart=()=>{
    listening=true; finalText=""; interimText="";
    statusEl.textContent="🎙️ سن رہا ہوں…";
    statusEl.style.color = "#176b3a";
  };
  r.onerror=e=>{statusEl.textContent="مائیک کا مسئلہ: "+e.error;};
  r.onend=()=>{if(listening){try{r.start()}catch(e){}}else statusEl.textContent="سننا بند";};
  
  r.onresult=e=>{
    let interim="";
    for(let j=e.resultIndex;j<e.results.length;j++){
      const t=e.results[j][0].transcript.trim();
      if(e.results[j].isFinal){
        finalText += (finalText ? " " : "") + t;
      } else {
        interim += (interim ? " " : "") + t;
      }
    }
    interimText = interim;
    
    const displayText = (finalText + " " + interimText).trim();
    if(displayText){
      highlightWords(displayText);
    }
  };
  return r;
}

document.getElementById("micTest").onclick=async()=>{
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent="اس ماحول میں مائیک کی اجازت نہیں۔ Chrome کے HTTPS صفحے میں کھولیں۔";
      return;
    }
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    statusEl.textContent="✅ مائیک کی اجازت مل گئی۔";
    statusEl.style.color = "#176b3a";
  }catch(e){
    statusEl.textContent="❌ مائیک کی اجازت نہیں ملی۔";
    statusEl.style.color = "#b32121";
  }
};
document.getElementById("start").onclick=()=>{
  if(!recognition) recognition=makeRecognition();
  if(recognition){listening=true;finalText="";interimText="";try{recognition.start()}catch(e){}}
};
document.getElementById("stop").onclick=()=>{
  listening=false;
  if(recognition) recognition.stop();
  statusEl.textContent="سننا بند";
};

renderSurah();
</script>
</body>
</html>
